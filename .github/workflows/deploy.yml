name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Sin set -e, cada paso fallaba en silencio y el deploy se
            # reportaba como correcto: así estuvo semanas sin instalar
            # dependencias (composer.json y el lock no cuadraban) sin que
            # nadie lo viera. Mejor un deploy que falla a la vista.
            set -e
            git config --global --add safe.directory /var/www/ia-skills
            cd /var/www/ia-skills
            git pull origin main
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            php artisan migrate --force
            for f in database/imports/*.json; do
              [ -f "$f" ] || continue
              php artisan skills:import "$f"
              rm "$f"
            done
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan cache:clear
            chown -R www-data:www-data /var/www/ia-skills/storage /var/www/ia-skills/bootstrap/cache

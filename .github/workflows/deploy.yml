name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Barrera: si los tests o el build fallan, no se despliega. Antes el push a
  # main iba directo al servidor y ejecutaba `migrate --force` aunque el código
  # estuviera roto.
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Sin set -e, cada paso fallaba en silencio y el deploy se
            # reportaba como correcto: así estuvo semanas sin instalar
            # dependencias (composer.json y el lock no cuadraban) sin que
            # nadie lo viera. Mejor un deploy que falla a la vista.
            set -e
            git config --global --add safe.directory /var/www/ia-skills
            cd /var/www/ia-skills
            git pull origin main
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            # Vite ya no vacía public/build (ver vite.config.js): se borran
            # los assets de compilaciones de hace más de 7 días. Cada build
            # reescribe los actuales, así que nunca entran en el filtro, y se
            # conservan una semana los que aún pueda pedir una pestaña abierta.
            find public/build/assets -type f -mtime +7 -delete
            php artisan migrate --force
            for f in database/imports/*.json; do
              [ -f "$f" ] || continue
              php artisan skills:import "$f"
              rm "$f"
            done
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan cache:clear
            chown -R www-data:www-data /var/www/ia-skills/storage /var/www/ia-skills/bootstrap/cache

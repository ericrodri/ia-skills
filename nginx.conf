# El host canónico es ia-skills.com (sin www): es el que emiten los canonical,
# el sitemap y robots.txt. Este bloque existe para que www NUNCA sirva una copia
# del sitio: durante un tiempo ambos hosts compartieron un solo server_name sin
# redirección, y se indexó por duplicado.
server {
    listen 80;
    server_name www.ia-skills.com;
    return 301 http://ia-skills.com$request_uri;
}

server {
    listen 80;
    server_name ia-skills.com;

    root /var/www/ia-skills/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(env|git|ht) {
        deny all;
    }

    access_log /var/log/nginx/ia-skills.access.log;
    error_log  /var/log/nginx/ia-skills.error.log;
}

# Nota: en producción Certbot añade los bloques 443 a partir de estos. Al
# tocarlos hay que mantener la misma separación — un server block para
# www.ia-skills.com que solo redirige, y otro para ia-skills.com que sirve —
# porque si ambos nombres vuelven a compartir bloque, la duplicación regresa.

# Configuración de nginx de ia-skills.com (referencia del repo).
#
# Refleja lo que hay en /etc/nginx/sites-available/ia-skills en el servidor.
# No se aplica en el despliegue: si se cambia aquí, hay que copiarlo a mano.
#
# El host canónico es ia-skills.com, sin www: es el que emiten los canonical,
# el sitemap y robots.txt. Los dos bloques de abajo existen por dos incidentes
# reales, así que conviene no fusionarlos:
#
#   1. Durante meses ambos nombres compartieron un único server block sin
#      redirección, y www sirvió una copia completa del sitio que se indexó
#      aparte. Bing llegó a tener la portada y /skills en www mientras las
#      fichas estaban en el apex.
#   2. El bloque de la aplicación nunca escuchó en el puerto 80. Como el
#      servidor aloja más dominios, todo el tráfico http de ia-skills.com caía
#      en el default_server de otro sitio y acababa redirigido a criptohacienda.com.
#      Quien escribía el dominio sin https:// terminaba en una web ajena.

# Todo el tráfico en claro va al host canónico en HTTPS.
# El punto inicial de `.ia-skills.com` es sintaxis de nginx para "el dominio y
# todos sus subdominios", así que cubre el apex y www con un solo nombre.
server {
    listen 80;
    listen [::]:80;
    server_name .ia-skills.com;
    return 301 https://ia-skills.com$request_uri;
}

server {
    # 8001 es un resto del montaje inicial; no está expuesto al exterior.
    # El tráfico real entra por el 443 que gestiona Certbot, más abajo.
    listen 8001;
    server_name ia-skills.com www.ia-skills.com;

    root /var/www/ia-skills/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(env|git|ht) {
        deny all;
    }

    access_log /var/log/nginx/ia-skills.access.log;
    error_log  /var/log/nginx/ia-skills.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ia-skills.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ia-skills.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Aquí www lo resuelve la aplicación (App\Http\Middleware\RedirectToCanonicalHost),
# que redirige 301 al apex cualquier petición que llegue por www. Si algún día se
# prefiere resolverlo en nginx y ahorrar el arranque de PHP, basta con sacar
# www.ia-skills.com del server_name de arriba y darle su propio bloque 443 con
# `return 301 https://ia-skills.com$request_uri;` y los mismos certificados.
